<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#555"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#222}.title{font-size:21px;font-weight:700}.bt{font-size:15px;font-weight:700}.body{font-size:14px}.line{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1000" height="1000" fill="#fff"/>
  <rect x="110" y="30" width="780" height="58" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="500" y="66" text-anchor="middle" class="title">Modified SiZer workflow</text>
  <rect x="280" y="125" width="440" height="64" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="500" y="151" text-anchor="middle" class="bt">Paired data and scale grid</text><text x="500" y="175" text-anchor="middle" class="body">(X,Y), X-grid, bandwidths h</text>
  <path d="M500 189 V235" class="line"/>
  <rect x="240" y="235" width="520" height="70" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="500" y="262" text-anchor="middle" class="bt">At each (x₀,h), calculate Gaussian weights</text><text x="500" y="288" text-anchor="middle" class="body">wᵢ = exp[−0.5((xᵢ−x₀)/h)²]</text>
  <path d="M500 305 V350" class="line"/>
  <rect x="240" y="350" width="520" height="72" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="500" y="377" text-anchor="middle" class="bt">Fit weighted local linear regression</text><text x="500" y="404" text-anchor="middle" class="body">y = β₀ + β₁(x−x₀)  →  derivative = β̂₁</text>
  <path d="M500 422 V470" class="line"/>
  <rect x="210" y="470" width="580" height="90" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="500" y="508" text-anchor="middle" class="bt">Classify derivative: − / flat / +</text><text x="500" y="538" text-anchor="middle" class="body">Flat = within 5% of the maximum slope</text>
  <path d="M500 560 V610" class="line"/>
  <rect x="250" y="610" width="500" height="68" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="500" y="637" text-anchor="middle" class="bt">Display the SiZer map</text><text x="500" y="662" text-anchor="middle" class="body">X position × bandwidth, coloured by − / flat / +</text>
  <path d="M500 678 V730" class="line"/>
  <rect x="180" y="730" width="640" height="72" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="500" y="757" text-anchor="middle" class="bt">Extract three features</text><text x="500" y="784" text-anchor="middle" class="body">Sign changes  |  Non-flat width ratio  |  Bandwidth persistence</text>
  <path d="M500 802 V855" class="line"/>
  <rect x="280" y="855" width="440" height="68" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="500" y="882" text-anchor="middle" class="bt">Shape classification</text><text x="500" y="908" text-anchor="middle" class="body">S-shaped  |  Cubic  |  Threshold</text>
</svg>
